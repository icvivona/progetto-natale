<html lang="it">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style id="app-css">
/* Layout: project band (name, Mercatino countdown, progress) over a sticky tab rail; one working column of rows, tables and a few cards */
:root{
  --paper:#eff2ee; --sheet:#fbfcfa; --ink:#18221d; --muted:#56645d; --line:#d3dbd5;
  --pine:#1c5a45; --pine-soft:#dcebe3; --on-pine:#ffffff;
  --berry:#a8322b; --berry-soft:#f5e1de;
  --leaf:#4a7a27; --leaf-soft:#e4efd8;
  --amber:#8f5506; --amber-soft:#f7e8cf;
  --danger:#b42318;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,"Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111714; --sheet:#18201c; --ink:#e3eae6; --muted:#9caba4; --line:#2d3934;
    --pine:#7cc4a6; --pine-soft:#1b3429; --on-pine:#0c1712;
    --berry:#f0897f; --berry-soft:#3a1f1c;
    --leaf:#a6cf7c; --leaf-soft:#223018;
    --amber:#eeb459; --amber-soft:#382a12;
    --danger:#ff8a80;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#111714; --sheet:#18201c; --ink:#e3eae6; --muted:#9caba4; --line:#2d3934;
  --pine:#7cc4a6; --pine-soft:#1b3429; --on-pine:#0c1712;
  --berry:#f0897f; --berry-soft:#3a1f1c;
  --leaf:#a6cf7c; --leaf-soft:#223018;
  --amber:#eeb459; --amber-soft:#382a12;
  --danger:#ff8a80;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:70rem;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.boot{padding-block:40px;color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
p{margin:0}
a{color:var(--pine)}

/* band */
.band{background:var(--sheet);border-bottom:1px solid var(--line)}
.head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.55fr);gap:22px 40px;padding-block:28px 24px;align-items:end}
@media (max-width:860px){.head{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:.76rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px}
h1{font-size:clamp(2.1rem,4.6vw,3.1rem);font-weight:800;line-height:1;color:var(--pine)}
.sub{margin-top:10px;color:var(--muted);max-width:44ch}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:600px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.stat.mk{grid-column:1/-1}.stats .v{font-size:1.25rem}.tabs a{padding-inline:10px}}
.stat{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--paper);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat.mk{background:var(--berry-soft);border-color:transparent}
.stat.mk .v{color:var(--berry)}
.k,.lbl{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.v{font-family:var(--f-display);font-size:1.5rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.s{font-size:.84rem;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--pine);border-radius:3px}

/* tabs */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.tabs .wrap{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs .wrap::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:13px 12px 10px;color:var(--muted);text-decoration:none;font-weight:700;font-size:.95rem;border-bottom:3px solid transparent;white-space:nowrap}
.tabs a:hover{color:var(--ink)}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--pine)}
.mode{font-size:.88rem;color:var(--muted);padding-top:14px}
.mode b{color:var(--ink)}
main{padding-block:18px 130px}

/* sections */
.sec{margin-top:30px}
.sec:first-child{margin-top:8px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:6px 14px;flex-wrap:wrap;margin-bottom:12px}
h2{font-size:1.35rem;font-weight:700}
.hint{color:var(--muted);font-size:.9rem;max-width:62ch}
.empty{color:var(--muted);font-style:italic;font-size:.92rem;padding:10px 0}

/* next deadlines */
.next{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:920px){.next{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.next{grid-template-columns:minmax(0,1fr)}}
.next li{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.next .d{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.next .x{font-weight:700;line-height:1.3}
.next .w{font-size:.85rem;color:var(--muted)}
.next li.late{border-color:var(--danger)}
.next li.late .d{color:var(--danger)}

/* filters */
.filters{display:flex;gap:10px 18px;align-items:end;flex-wrap:wrap;margin-top:30px;padding:12px 14px;border-radius:var(--r);background:var(--sheet);border:1px solid var(--line)}
.filters .field{width:min(240px,100%)}
.check{display:inline-flex;align-items:center;gap:8px;font-size:.92rem;cursor:pointer;padding-bottom:7px}

/* phases + tasks */
.t-berry{--tone:var(--berry);--tone-soft:var(--berry-soft)}
.t-leaf{--tone:var(--leaf);--tone-soft:var(--leaf-soft)}
.t-pine{--tone:var(--pine);--tone-soft:var(--pine-soft)}
.fase{margin-top:26px}
.fase-h{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap;padding-bottom:8px;border-bottom:2px solid var(--tone)}
.tag{font-family:var(--f-mono);font-size:.72rem;padding:3px 8px;border-radius:999px;background:var(--tone-soft);color:var(--tone);text-transform:uppercase;letter-spacing:.04em}
.fase-h h3{font-size:1.12rem}
.per{color:var(--muted);font-size:.88rem}
.cnt{margin-left:auto;font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.tasks{list-style:none;margin:0;padding:0}
.task{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px 14px;align-items:start;padding:12px 0;border-bottom:1px solid var(--line)}
@media (max-width:540px){.task{grid-template-columns:auto minmax(0,1fr)}.task>.ico{grid-column:2;justify-self:start;margin-top:-4px;padding-left:0}}
.st{display:inline-flex;align-items:center;gap:7px;font:700 .78rem/1 var(--f-body);padding:7px 11px;border-radius:999px;border:1.5px solid var(--line);background:var(--sheet);color:var(--muted);min-width:7.4em;white-space:nowrap}
button.st{cursor:pointer}
button.st:hover{border-color:var(--muted)}
.dot{width:11px;height:11px;border-radius:50%;border:2px solid currentColor;flex:none}
.s-doing .st{border-color:var(--amber);color:var(--amber);background:var(--amber-soft)}
.s-doing .dot{background:linear-gradient(90deg,currentColor 50%,transparent 50%)}
.s-done .st{border-color:var(--pine);color:var(--on-pine);background:var(--pine)}
.s-done .dot{background:currentColor}
.s-done .tt{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.tt{font-weight:700;line-height:1.35}
.meta{margin-top:4px;display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.86rem;color:var(--muted)}
.due{font-family:var(--f-mono);font-size:.8rem}
.late .due,.due.late{color:var(--danger);font-weight:700}
.src{font-style:italic}
.nota{margin-top:5px;font-size:.92rem}
.ico{background:none;border:1px solid transparent;color:var(--pine);font:700 .84rem var(--f-body);padding:7px 9px;border-radius:7px;cursor:pointer;white-space:nowrap}
.ico:hover{border-color:var(--line)}
.add{margin-top:6px}

/* forms */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;font-weight:700;color:var(--muted)}
input,select{font:inherit;font-size:.95rem;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:7px 9px;min-width:0;width:100%}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--pine);padding:0;flex:none}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.fixed{font-size:.88rem;color:var(--muted);padding:8px 0}
.editor{grid-column:1/-1;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding:14px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);margin-top:4px}
.w2{grid-column:span 2}.w4{grid-column:1/-1}
@media (max-width:640px){.editor{grid-template-columns:repeat(2,minmax(0,1fr))}.editor .w2,.editor .w4{grid-column:1/-1}}
.btn{font:700 .9rem var(--f-body);padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.btn.warn{color:var(--danger)}
.btn.sm{padding:5px 9px;font-size:.8rem}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.addform{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end;margin-top:12px;padding:14px;border:1px dashed var(--line);border-radius:var(--r)}
.addform .w2{grid-column:span 2}
.addform .w3{grid-column:span 3}
@media (max-width:760px){.addform{grid-template-columns:repeat(2,minmax(0,1fr))}.addform .w2,.addform .w3{grid-column:1/-1}}
.addform .check{padding-bottom:9px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);background:var(--paper);white-space:nowrap;font-weight:700}
tbody tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums}
td input{padding:6px 7px}
.tbl-sess{min-width:860px}.tbl-classi{min-width:720px}.tbl-cassa{min-width:640px}
td.c-id{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.pos{color:var(--pine)}.neg{color:var(--berry)}
.pill{display:inline-block;font-size:.76rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--paper);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--pine-soft);border-color:transparent;color:var(--pine)}
.pill.warn{background:var(--amber-soft);border-color:transparent;color:var(--amber)}

/* gantt */
.g-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sheet);padding:6px 14px 10px}
.gantt{min-width:700px;display:grid;grid-template-columns:minmax(220px,1.7fr) repeat(9,minmax(0,1fr));position:relative;font-size:.88rem}
.g-m{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);text-align:center;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.g-m.cur{color:var(--ink)}
.g-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;padding:8px 0 6px;border-bottom:1px solid var(--line)}
.g-l{padding:9px 12px 9px 0;border-bottom:1px solid var(--line);line-height:1.3;min-width:0}
.g-c{border-bottom:1px solid var(--line);border-left:1px solid var(--line);padding:0 1px;display:flex;align-items:center}
.g-c i{display:block;height:14px;width:100%;background:var(--tone)}
.g-c.first i{border-top-left-radius:7px;border-bottom-left-radius:7px;margin-left:3px}
.g-c.last i{border-top-right-radius:7px;border-bottom-right-radius:7px;margin-right:3px}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);pointer-events:none}
.g-today span{position:absolute;bottom:4px;left:4px;font-family:var(--f-mono);font-size:.68rem;background:var(--ink);color:var(--paper);padding:1px 5px;border-radius:4px;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.85rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:8px;border-radius:4px;background:var(--tone);display:inline-block}

/* weeks */
.weeks{border-top:1px solid var(--line)}
.week{display:grid;grid-template-columns:10rem minmax(0,1fr);gap:6px 16px;padding:11px 0;border-bottom:1px solid var(--line)}
@media (max-width:540px){.week{grid-template-columns:minmax(0,1fr)}}
.wk{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);padding-top:2px}
.week.now .wk{color:var(--ink)}
.week.now .wk b{display:inline-block;margin-left:6px;font-family:var(--f-body);font-size:.7rem;background:var(--pine);color:var(--on-pine);padding:2px 7px;border-radius:999px;vertical-align:1px}
.week.hol{color:var(--muted)}
.wi{display:flex;flex-direction:column;gap:7px;min-width:0}
.wrow{display:flex;gap:10px;align-items:baseline;min-width:0}
.wrow .pill{flex:none}
.wrow .x{min-width:0}
.ev{font-size:.88rem;color:var(--berry);font-weight:700}
.ev.mk{color:var(--berry)}
.dates{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
@media (max-width:640px){.dates{grid-template-columns:minmax(0,1fr)}}
.dates li{display:grid;grid-template-columns:7.5rem minmax(0,1fr);gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.dates .due{color:var(--muted)}

/* lavori */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card.scelto{border-color:var(--pine);box-shadow:inset 0 0 0 1px var(--pine)}
.card.scartato{opacity:.62}
.card-h{display:flex;justify-content:space-between;align-items:start;gap:10px}
.card h3{font-size:1.04rem;line-height:1.25}
.lvl{font-size:.74rem;font-weight:700;color:var(--muted);white-space:nowrap;display:inline-flex;gap:3px;align-items:center;padding-top:3px}
.lvl i{width:7px;height:7px;border-radius:50%;background:var(--line);display:inline-block}
.lvl i.on{background:var(--pine)}
.card .mat{font-size:.9rem}
.card .s{font-size:.84rem}
.seg{display:flex;gap:4px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.seg button{font:700 .78rem var(--f-body);padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pine);border-color:var(--pine);color:var(--on-pine)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px dashed var(--line);border-radius:999px;padding:5px 12px;font:inherit;font-size:.88rem;background:var(--sheet);color:var(--ink)}
button.chip{cursor:pointer}
.chip small{color:var(--muted);font-size:.78rem}
.chip.ok{border-style:solid;border-color:var(--pine)}
.chip.poco{border-style:solid;border-color:var(--amber);background:var(--amber-soft)}
.chip.compra{border-style:solid;border-color:var(--berry);background:var(--berry-soft)}
.inline-add{display:flex;gap:8px;margin-top:12px;max-width:420px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--sheet);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:2px}

/* accordi */
.acc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 36px}
@media (max-width:760px){.acc{grid-template-columns:minmax(0,1fr)}}
.block{border-top:2px solid var(--line);padding-top:12px;min-width:0}
.block h3{font-size:1.08rem;margin-bottom:10px}
.block ul{margin:0;padding-left:1.15em;display:grid;gap:7px}
.block .prop{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.block .prop .lbl{display:block;margin-bottom:8px}
.roles{display:grid;gap:12px;margin:0}
.roles dt{font-weight:700}
.roles dd{margin:2px 0 0;color:var(--muted);font-size:.93rem}
.mk-form{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;padding:14px;background:var(--berry-soft);border-radius:var(--r)}
@media (max-width:640px){.mk-form{grid-template-columns:minmax(0,1fr)}}
.mk-read{display:grid;gap:6px;padding:14px 16px;background:var(--berry-soft);border-radius:var(--r)}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:7.5rem minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
@media (max-width:540px){.log li{grid-template-columns:minmax(0,1fr) auto}.log li .due{grid-column:1/-1}}
code{font-family:var(--f-mono);font-size:.84em;background:var(--paper);border:1px solid var(--line);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

footer{border-top:1px solid var(--line);margin-top:40px;padding-top:16px;font-size:.84rem;color:var(--muted);display:grid;gap:4px}
.export{display:grid;gap:8px;margin-top:10px;padding-top:12px;border-top:1px dashed var(--line)}
.export b{color:var(--ink)}
.export-box{width:100%;min-height:10rem;font:.78rem/1.45 var(--f-mono);color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:7px;padding:8px 10px;resize:vertical}
.export-box:focus-visible{outline:2px solid var(--pine);outline-offset:2px}
.linkbtn{background:none;border:0;padding:0;margin-left:4px;color:var(--pine);font:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.login{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:end;margin-top:10px;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:var(--r)}
.login .field{width:min(220px,100%)}
.login .s{flex-basis:100%}

/* save bar + toast */
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--paper);padding-bottom:env(safe-area-inset-bottom,0px)}
.savebar .wrap{display:flex;gap:10px 14px;align-items:center;justify-content:space-between;padding-block:12px;flex-wrap:wrap}
.savebar p{font-size:.92rem}
.savebar .btn{border-color:var(--paper);background:transparent;color:var(--paper)}
.savebar .btn.pri{background:var(--paper);color:var(--ink)}

function markDirty() {
  dirty = true; renderSavebar();

}
function autoSave() {
  if (!dirty || saving) return;

function save(retried) {
  if (!dirty || saving) return;
  if (GH) { saveGH(0); return; }
  if (LOCAL) { toast('Anteprima locale: qui non si salva.'); return; }
  if (!artifactNS) { toast('Il salvataggio non è disponibile in questa vista.'); return; }
  clearTimeout(autoTimer);
  saving = true; renderSavebar();
  S.updated = TODAY;
  try { sessionStorage.setItem('pn-restore', JSON.stringify({ tab: curTab(), y: window.scrollY })); } catch (e) {}
  artifactNS.publish(buildDoc()).then(function () {
    dirty = false; saving = false; renderSavebar();
  }, function (err) {
    saving = false;
    var code = err && err.code;
    if (code === 'conflict') {
      try { sessionStorage.setItem('pn-restore', JSON.stringify({ tab: curTab(), y: window.scrollY, notice: 'conflict' })); } catch (e) {}
      dirty = false;
    } else if (code === 'upstream_error' && !retried) {
      setTimeout(function () { save(true); }, 900 + Math.random() * 1200); return;
    } else if (code === 'rate_limited') {
      toast('Troppi salvataggi ravvicinati: riprova tra qualche secondo.');
    } else if (code === 'too_large') {
      toast('La pagina è diventata troppo grande per essere salvata.');
    } else if (['not_writer', 'not_granted', 'not_declared', 'consent_required', 'capability_disabled', 'capability_removed'].indexOf(code) > -1) {
      canWrite = false; dirty = false; S = JSON.parse(ORIGINAL); render();

    } else {

    }
    renderSavebar();
  });
}

    drafts.lavoro = { nome: '', materiali: '', livello: '1', incontri: '1', nota: '' };
  } else if (kind === 'mat') {
    if (!drafts.mat.n.trim()) return;
    S.materiale.push({ id: uid('m'), n: drafts.mat.n.trim(), s: 'ver' });
    drafts.mat.n = '';
  } else if (kind === 'dec') {
    var dd = drafts.dec;
    if (!dd.testo.trim()) { toast('Scrivi la decisione presa.'); return; }
    S.decisioni.push({ id: uid('d'), data: dd.data || TODAY, testo: dd.testo.trim() });
    drafts.dec = { data: TODAY, testo: '' };
  }
  markDirty(); rerenderKeepFocus();
});
document.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]');
  if (!b) return;
  var act = b.dataset.act, id = b.dataset.id, t;
  if (act === 'save') { save(); return; }
  if (act === 'undo') { S = JSON.parse(BASE_JSON); dirty = false; editing = null; confirmDel = null; clearTimeout(autoTimer); render(); toast('Modifiche annullate.'); return; }
  if (act === 'gh-login-open') {
    loginOpen = true; render();
    var lf = document.getElementById(lastName ? 'gh-codice' : 'gh-nome'); if (lf) lf.focus();
    return;
  }
  if (act === 'gh-login-cancel') { loginOpen = false; render(); return; }
  if (act === 'gh-logout') {
    if (dirty || saving) { toast('Aspetta che le modifiche siano salvate, poi esci.'); return; }
    ghCredClear(); ghCred = null; canWrite = false; editing = null; confirmDel = null; render();
    toast('Sei uscito dalla modifica.');
    return;
  }
  if (!canWrite) return;
  switch (act) {
    case 'cycle':
      t = findIn('tasks', id); if (!t) return;
      t.stato = NEXT_STATO[t.stato] || 'doing'; markDirty(); rerenderKeepFocus();
      var nb = document.querySelector('[data-act="cycle"][data-id="' + id + '"]'); if (nb) nb.focus({ preventScroll: true });
      break;
    case 'edit-task':
      editing = editing === id ? null : id; confirmDel = null; render();
      if (editing) { var inp = document.getElementById('e-t-' + id); if (inp) inp.focus({ preventScroll: true }); }
      break;
    case 'close-edit': editing = null; confirmDel = null; render(); break;
    case 'add-task':
      t = { id: uid('t'), fase: b.dataset.fase, t: '', chi: 'Referenti', entro: '', stato: 'todo', fonte: '', nota: '' };
      S.tasks.push(t); editing = t.id; markDirty(); render();
      var ni = document.getElementById('e-t-' + t.id); if (ni) { ni.focus(); ni.placeholder = 'Descrivi l’attività'; }
      break;
    case 'del':
      var key = b.dataset.coll + ':' + id;
      if (confirmDel === key) {
        var coll = b.dataset.coll, k = coll === 'classi' ? 'c' : 'id';
        S[coll] = S[coll].filter(function (x) { return x[k] !== id; });
        if (editing === id) editing = null;
        confirmDel = null; markDirty();
      } else confirmDel = key;
      rerenderKeepFocus();
      break;
    case 'cancel-del': confirmDel = null; render(); break;
    case 'lavoro-stato':
      t = findIn('lavori', id); if (!t) return;
      t.stato = b.dataset.v; markDirty(); render();
      break;
    case 'mat-cycle':
      t = findIn('materiale', id); if (!t) return;
      t.s = NEXT_MAT[t.s] || 'ok'; markDirty(); rerenderKeepFocus();
      var mb = document.querySelector('[data-act="mat-cycle"][data-id="' + id + '"]'); if (mb) mb.focus({ preventScroll: true });
      break;
    case 'export-dl':
      if (dirty) { toast('Salva prima le modifiche, poi scarica i dati.'); break; }
      if (!dlNS) { toast('Qui il download non è disponibile: usa «Copia i dati».'); break; }
      dlNS.save({ filename: 'dati.json', data: exportJSON() }).then(function (r) {
        if (r && r.status === 'saved') toast('dati.json scaricato: caricalo nel repository su GitHub.');
      }, function (err) {
        var code = err && err.code;
        if (code === 'declined') return;
        toast(code === 'rate_limited' ? 'C’è già un download in attesa di conferma.' : 'Download non riuscito: usa «Copia i dati».');
      });
      break;
    case 'export-copy':
      if (dirty) { toast('Salva prima le modifiche, poi copia i dati.'); break; }
      var openBox = function () {
        exportBox = true; render();
        var ta = document.getElementById('export-box');
        if (ta) { ta.focus(); ta.select(); }
        toast('Copia il testo selezionato e incollalo in dati.json su GitHub.');
      };
      try {
        navigator.clipboard.writeText(exportJSON()).then(function () { toast('Dati copiati: incollali in dati.json su GitHub.'); }, openBox);
      } catch (err) { openBox(); }
      break;
    case 'add-sess':
      t = { id: uid('s'), data: '', ora: '', gruppo: '', aula: '', docenti: '', lavoro: '', stato: 'da fissare' };
      S.sessioni.push(t); markDirty(); render();
      var si = document.getElementById('s-d-' + t.id); if (si) si.focus();
      break;
  }
});
window.addEventListener('hashchange', function () {
  editing = null; confirmDel = null; render();
  if (skipScroll) { skipScroll = false; return; }
  window.scrollTo(0, 0);
});
window.addEventListener('resize', placeToday);
window.addEventListener('beforeunload', function (e) { if (dirty && !saving) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- capabilities ---------- */
function initCaps(tries) {
  var c = window.claude;
  if (!c || typeof c.use !== 'function') {
    if ((tries || 0) < 6) setTimeout(function () { initCaps((tries || 0) + 1); }, 250);
    else if (!LOCAL) { modeKnown = true; render(); }
    return;
  }
  Promise.all([c.use('artifact'), c.use('user'), c.use('downloads').catch(function () { return null; })]).then(function (r) {
    artifactNS = r[0]; dlNS = r[2] || null;
    var u = r[1];
    if (!artifactNS || !u) return false;
    return u.canEdit().catch(function () { return false; });
  }).catch(function () { return false; }).then(function (w) {
    canWrite = !!w; modeKnown = true; render();
  });
}

/* ---------- sito pubblico (GitHub Pages) con archivio su Foglio Google ---------- */
function ghCredLoad() {
  try { var s = sessionStorage.getItem('pn-accesso') || localStorage.getItem('pn-accesso'); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}
function ghCredSave(c, remember) {
  try { (remember ? localStorage : sessionStorage).setItem('pn-accesso', JSON.stringify(c)); } catch (e) {}
}
function ghCredClear() {
  try { sessionStorage.removeItem('pn-accesso'); localStorage.removeItem('pn-accesso'); } catch (e) {}
}
function getJSON(url) {
  return fetch(url, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function validData(d) { return !!(d && d.mercatino && Array.isArray(d.tasks) && Array.isArray(d.classi)); }
function normData(d) {
  ['sessioni', 'lavori', 'materiale', 'cassa', 'decisioni'].forEach(function (k) { if (!Array.isArray(d[k])) d[k] = []; });
  return d;
}
function apiGet() {
  return fetch(GH_URL + (GH_URL.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}
function apiPost(payload) {
  return fetch(GH_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(payload) })
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
}

/* unione a tre vie, riga per riga: chi ha cambiato una riga la tiene; le righe nuove si sommano */
function sameJ(a, b) { return JSON.stringify(a) === JSON.stringify(b); }
function mergeList(coll, base, local, remote) {
  var k = coll === 'classi' ? 'c' : 'id';
  var idx = function (arr) { var m = {}; (arr || []).forEach(function (x) { if (x && x[k] != null) m[x[k]] = x; }); return m; };
  var B = idx(base), L = idx(local), seen = {}, out = [];
  (remote || []).forEach(function (r) {
    var id = r[k]; seen[id] = true;
    if (id in L) out.push(!(id in B) || !sameJ(L[id], B[id]) ? L[id] : r);
    else if (!(id in B) || !sameJ(r, B[id])) out.push(r);
  });
  (local || []).forEach(function (l) {
    var id = l[k];
    if (!seen[id] && (!(id in B) || !sameJ(l, B[id]))) out.push(l);
  });
  return out;
}
function merge3(base, local, remote) {
  var out = JSON.parse(JSON.stringify(remote));
  ['tasks', 'sessioni', 'lavori', 'materiale', 'classi', 'cassa', 'decisioni'].forEach(function (c) { out[c] = mergeList(c, base[c], local[c], remote[c]); });
  var bm = base.mercatino || {}, lm = local.mercatino || {};
  out.mercatino = out.mercatino || {};
  Object.keys(lm).forEach(function (f) { if (lm[f] !== bm[f]) out.mercatino[f] = lm[f]; });
  out.updated = (local.updated || '') > (remote.updated || '') ? local.updated : remote.updated;
  return JSON.parse(JSON.stringify(out));
}

function loadGH() {
  var finish = function (state) { ghData = state; render(); };
  if (!window.fetch) { finish('fallback'); return; }
  var fromFile = function (state) {
    return getJSON('dati.json').then(function (d) {
      if (!validData(d)) throw new Error('formato non valido');
      S = normData(d); BASE_JSON = JSON.stringify(S);
      return state;
    });
  };
  getJSON('config.json').then(function (c) {
    var u = c && typeof c.backend === 'string' ? c.backend.trim() : '';
    if (!/^https?:\/\/\S+$/.test(u)) return 'file';
    GH_URL = u; return 'backend';
  }, function () { return 'file'; }).then(function (kind) {
    if (kind === 'file') return fromFile('ok');
    return apiGet().then(function (r) {
      if (!r || !r.ok) throw new Error('archivio');
      baseVer = Number(r.versione) || 0;
      if (r.dati && validData(r.dati)) { S = normData(r.dati); BASE_JSON = JSON.stringify(S); return 'live'; }
      return fromFile('live');
    }).catch(function () {
      GH_URL = '';
      return fromFile('offline').catch(function () { return 'offline'; });
    });
  }).then(function (state) {
    if (state === 'live') { ghCred = ghCredLoad(); canWrite = !!ghCred; startPoll(); }
    finish(state);
  }).catch(function () { finish('fallback'); });
}
function loginForm() {
  return '<form class="login" data-form="login">' +
    '<div class="field"><label for="gh-nome">Il tuo nome</label><input id="gh-nome" autocomplete="name" value="' + esc(lastName) + '" placeholder="es. Livio"></div>' +
    '<div class="field"><label for="gh-codice">Codice per modificare</label><input id="gh-codice" type="password" autocomplete="current-password"></div>' +
    '<label class="check"><input type="checkbox" id="gh-ricorda"> Ricorda su questo dispositivo</label>' +
    '<div class="row-btns"><button type="submit" class="btn pri" id="gh-entra">Entra</button><button type="button" class="btn" data-act="gh-login-cancel">Annulla</button></div>' +
    '<p class="s">Il codice lo danno i referenti del progetto. Su un computer condiviso non spuntare «Ricorda».</p></form>';
}
function ghLogin() {
  var nome = ((document.getElementById('gh-nome') || {}).value || '').trim();
  var codice = ((document.getElementById('gh-codice') || {}).value || '').trim();
  var ricorda = !!(document.getElementById('gh-ricorda') || {}).checked;
  var btn = document.getElementById('gh-entra');
  if (!codice) { toast('Inserisci il codice per modificare.'); return; }
  if (!GH_URL) { toast('L’archivio non è raggiungibile: riprova più tardi.'); return; }
  var reset = function () { if (btn) { btn.disabled = false; btn.textContent = 'Entra'; } };
  if (btn) { btn.disabled = true; btn.textContent = 'Verifica…'; }
  apiPost({ azione: 'verifica', codice: codice }).then(function (r) {
    if (r && r.ok) {
      ghCred = { nome: nome, codice: codice }; ghCredSave(ghCred, ricorda);
      lastName = nome; store('pn-nome', nome);
      canWrite = true; loginOpen = false; render();
      toast('Ora puoi modificare la pagina.');
      if (dirty) markDirty();
      return;
    }
    reset();
    toast(r && r.errore === 'codice-non-impostato' ? 'Il codice non è ancora stato impostato nell’archivio: avvisa i referenti.' : 'Codice non valido.');
  }, function () { reset(); toast('Collegamento all’archivio non riuscito: riprova.'); });
}
function saveGH(tries) {
  if (!GH_URL || !ghCred) { toast('Per salvare entra con il codice.'); return; }
  clearTimeout(autoTimer);
  saving = true; renderSavebar();
  S.updated = TODAY;
  var sent = JSON.stringify(S);
  apiPost({ azione: 'salva', codice: ghCred.codice, autore: ghCred.nome || '', versioneBase: baseVer, dati: S }).then(function (r) {
    saving = false;
    if (r && r.ok) {
      baseVer = Number(r.versione) || baseVer + 1;
      BASE_JSON = sent;
      dirty = JSON.stringify(S) !== sent;
      renderSavebar();
      if (dirty) markDirty();
      return;
    }
    var err = r && r.errore;
    if (err === 'conflitto' && r.dati && validData(r.dati) && tries < 3) {
      var remote = normData(r.dati);
      S = merge3(JSON.parse(BASE_JSON), S, remote);
      BASE_JSON = JSON.stringify(remote); baseVer = Number(r.versione) || 0;
      rerenderKeepFocus();
      saveGH(tries + 1);
      return;
    }
    if (err === 'codice' || err === 'codice-non-impostato') {
      ghCredClear(); ghCred = null; canWrite = false; loginOpen = true; render();
      toast('Il codice non è più valido: inseriscilo di nuovo. Le tue modifiche sono ancora qui.');
      return;
    }
    renderSavebar();
    toast('Salvataggio non riuscito. Riprova con «Salva per tutti».');
  }, function () {
    saving = false; renderSavebar();
    toast('Salvataggio non riuscito: controlla la connessione e riprova con «Salva per tutti».');
  });
}
function refreshGH() {
  if (!GH_URL || dirty || saving || loginOpen || editing || confirmDel) return;
  var ae = document.activeElement;
  if (ae && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) return;
  apiGet().then(function (r) {
    if (!r || !r.ok || !validData(r.dati) || dirty || saving) return;
    var v = Number(r.versione) || 0;
    if (v <= baseVer) return;
    S = normData(r.dati); BASE_JSON = JSON.stringify(S); baseVer = v;
    rerenderKeepFocus();
  }).catch(function () {});
}
function startPoll() {
  clearInterval(pollT);
  pollT = setInterval(function () { if (!document.hidden) refreshGH(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) refreshGH(); });
}

render();
if (restore) {
  if (restore.y) setTimeout(function () { window.scrollTo(0, restore.y); }, 60);
  if (restore.notice === 'conflict') toast('Un collega ha salvato prima di te: la pagina mostra la sua versione. Ripeti la tua modifica.');
}
if (GH) loadGH();
else if (!LOCAL) initCaps(0);
})();
</script>
